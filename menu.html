<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Menu - Coffee House</title>

    <link rel="stylesheet" href="assets/css/boostrap.min.css"/>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f3ed;
        }

        .navbar {
            background-color: #211914;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }

        .nav-left, .nav-right {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .navbar a:hover {
            color: #d9a066;
        }

        .logo {
            color: #d9a066;
            font-size: 28px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #5c3825;
            margin: 40px 0;
        }

        .coffee-card {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 4px 10px #00000020;
            margin-bottom: 25px;
        }

        .coffee-card img {
            width: 100%;
            height: 50px;
            object-fit: cover;
        }

        .coffee-card h3 {
            color: #5c3825;
            margin-top: 20px;
        }

        .coffee-card p {
            padding: 0 15px;
        }

        .price {
            color: #8b542f;
            font-weight: bold;
            font-size: 20px;
        }

        .coffee-card button {
            background-color: #5c3825;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 10px 0 20px;
            border-radius: 5px;
        }

        .coffee-card button:hover {
            background-color: #d9a066;
            color: #211914;
        }

        footer {
            background-color: #211914;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 30px;
        }

        @media (max-width: 400px) {
            .navbar {
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
            }

            .nav-left, .nav-right {
                gap: 15px;
            }

            .logo {
                order: -1;
                width: 100%;
                text-align: center;
            }

            .navbar a {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="nav-left">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
        </div>

        <div class="logo">Coffee House</div>

        <div class="nav-right">
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <h1>Our Coffee Menu</h1>

    <div class="container">
        <div class="row">

            <div class="col-md-4">
                <div class="coffee-card">
                    <img src="images/iced-latte.jpg" alt="Iced Latte">

                    <h3>Iced Latte</h3>
                    <p>A refreshing coffee with cold milk and ice.</p>
                    <p class="price"> 30 DH</p>

                    <button onclick="chooseCoffee('Iced Latte', 30)">
                        Choose
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="coffee-card">
                    <img src="images/cappuccino.jpg" alt="Cappuccino">

                    <h3>Cappuccino</h3>
                    <p>Espresso with steamed milk and creamy foam.</p>
                    <p class="price">25 DH</p>

                    <button onclick="chooseCoffee('Cappuccino', 25)">
                        Choose
                    </button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="coffee-card">
                    <img src="images/espresso.jpg" alt="Espresso">

                    <h3>Espresso</h3>
                    <p>A small, strong, and delicious cup of coffee.</p>
                    <p class="price">18 DH</p>

                    <button onclick="chooseCoffee('Espresso', 18)">
                        Choose
                    </button>
                </div>
            </div>

        </div>
    </div>

    <footer>
        <p> 2026 Coffee House. All rights reserved.</p>
    </footer>

    <script>
        function chooseCoffee(name, price) {
            alert("You chose " + name + ". Price:"+ price + "DH");
        }
    </script>

</body>
</html>
